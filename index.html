<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farmacias de Turno - Olavarría</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 30px auto;
      padding: 0 15px;
      background-color: #f4f6f8;
      color: #333;
    }
    h1 {
      color: #1a5276;
      text-align: center;
    }
    .card {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    /* Estilo del aviso de alerta */
    .alerta-amarilla {
      background-color: #fff3cd;
      color: #856404;
      border: 1px solid #ffeeba;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 15px;
      display: none; /* Se oculta por defecto */
    }
    .farmacia-item {
      padding: 8px 0;
      border-bottom: 1px solid #eee;
    }
    .fuente-info {
      font-size: 0.85em;
      color: #666;
      margin-top: 15px;
      font-style: italic;
    }
    button {
      background-color: #27ae60;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>Farmacias de Turno</h1>

  <div class="card">
    <label for="fechaSelect">Seleccionar Fecha: </label>
    <input type="date" id="fechaSelect">
    <button onclick="consultarTurnos()">Buscar Turnos</button>
  </div>

  <!-- CARTEL DE ALERTA (Sólo visible si estimado === true) -->
  <div id="alertaEspecial" class="alerta-amarilla">
    ⚠️ <strong>LAS FUENTES OFICIALES ESTÁN CAÍDAS - VUELVA A INTENTAR PRONTO</strong><br>
    Se muestran datos de respaldo. Algunos pueden provenir de fuente alternativa parcial o del patrón estimado de 9 días.
  </div>

  <!-- CONTENEDOR DE RESULTADOS -->
  <div class="card">
    <h2>Turnos para el <span id="fechaMostrar">-</span></h2>
    <div id="listaFarmacias">Cargando datos...</div>
    <div id="fuenteUsada" class="fuente-info"></div>
  </div>

  <script>
    // -------------------------------------------------------------
    // 1. BASE DE DATOS Y CACHÉ
    // -------------------------------------------------------------
    const todasLasFarmacias = {
      // Reemplaza/Agrega aquí el listado con tus farmacias y direcciones reales
      "Farmacia Pasteur": "Vicente López 2900",
      "Farmacia Del Pueblo": "Rivadavia 2800",
      "Farmacia Central": "San Martín 2500"
    };

    const cacheTurnosPorMes = {};

    // -------------------------------------------------------------
    // 2. CONEXIÓN A FUENTES EXT
    // -------------------------------------------------------------
    async function fetchSourceHtml(url) {
      const proxies = [
        'https://api.allorigins.win/raw?url=',
        'https://corsproxy.io/?',
        'https://api.codetabs.com/v1/proxy?quest='
      ];

      for (const proxy of proxies) {
        try {
          const response = await fetch(proxy + encodeURIComponent(url));
          if (!response.ok) throw new Error(`Error ${response.status}`);
          const html = await response.text();
          if (html && html.length > 500) return html;
        } catch (error) {
          // Intenta con el siguiente proxy si el actual falla
        }
      }
      throw new Error('No se pudo cargar la fuente.');
    }

    function buildSourceUrlEnLineaNoticias() {
      return 'https://enlineanoticias.com.ar/farmacias-de-turno-en-olavarria/';
    }

    function buildSourceUrlSmata(fecha) {
      const mes = String(fecha.getMonth() + 1).padStart(2, '0');
      const anio = fecha.getFullYear();
      return `https://www.smataolavarria.com.ar/farmacias.php?m=${mes}&a=${anio}`;
    }

    function buildSourceUrlOlavarriaNoticias() {
      return 'https://olavarrianoticias.com.ar/farmacias-de-turno-en-olavarria/';
    }

    function cleanText(text) {
      return text.replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
    }

    // -------------------------------------------------------------
    // 3. PARSERS Y PATRÓN MATEMÁTICO (Mantén tus funciones activas)
    // -------------------------------------------------------------
    function parseTurnosEnLineaNoticias(text) {
      // Tu código para extraer turnos del texto de En Línea Noticias
      return null; 
    }

    function parseDirecciones(text) {
      return todasLasFarmacias;
    }

    function parseTurnos(text, names) {
      // Tu código para extraer turnos del texto de SMATA
      return null; 
    }

    function obtenerFarmaciasPorPatron(fecha) {
      // Tu código matemático de la rotación de 9 días
      return ["Farmacia Ejemplo 1", "Farmacia Ejemplo 2"];
    }

    // -------------------------------------------------------------
    // 4. LÓGICA PRINCIPAL (3 FUENTES + FALLBACK)
    // -------------------------------------------------------------
    async function obtenerDatosDelMes(fecha) {
      const urlEnLineaNoticias = buildSourceUrlEnLineaNoticias();
      const urlSmata = buildSourceUrlSmata(fecha);
      const urlOlavarriaNoticias = buildSourceUrlOlavarriaNoticias();

      const claveCache = `TURNOS_${fecha.getFullYear()}_${fecha.getMonth()}`;

      if (cacheTurnosPorMes[claveCache]) {
        return cacheTurnosPorMes[claveCache];
      }

      // Fuente 1: En Línea Noticias
      try {
        const htmlEnLinea = await fetchSourceHtml(urlEnLineaNoticias);
        const textEnLinea = cleanText(htmlEnLinea);
        const turnosEnLinea = parseTurnosEnLineaNoticias(textEnLinea);

        if (turnosEnLinea && Object.keys(turnosEnLinea).length > 0) {
          cacheTurnosPorMes[claveCache] = {
            fuente: 'En Línea Noticias',
            direcciones: todasLasFarmacias,
            turnos: turnosEnLinea,
            estimado: false // OK -> Sin alerta
          };
          return cacheTurnosPorMes[claveCache];
        }
      } catch (e) {
        console.warn('En Línea Noticias no disponible, probando SMATA...');
      }

      // Fuente 2: SMATA
      try {
        const htmlSmata = await fetchSourceHtml(urlSmata);
        const textSmata = cleanText(htmlSmata);
        const direccionesSmata = parseDirecciones(textSmata);
        const pharmacyNames = Object.keys(direccionesSmata);
        const turnosSmata = parseTurnos(textSmata, pharmacyNames);

        if (turnosSmata && Object.keys(turnosSmata).length > 0) {
          cacheTurnosPorMes[claveCache] = {
            fuente: 'SMATA',
            direcciones: direccionesSmata,
            turnos: turnosSmata,
            estimado: false // OK -> Sin alerta
          };
          return cacheTurnosPorMes[claveCache];
        }
      } catch (e) {
        console.warn('SMATA no disponible, probando Olavarría Noticias...');
      }

      // Fuente 3: Olavarría Noticias
      try {
        const htmlOlavarria = await fetchSourceHtml(urlOlavarriaNoticias);
        const textOlavarria = cleanText(htmlOlavarria);
        const turnosOlavarria = typeof parseTurnosOlavarriaNoticias === 'function' 
          ? parseTurnosOlavarriaNoticias(textOlavarria) 
          : parseTurnosEnLineaNoticias(textOlavarria);

        if (turnosOlavarria && Object.keys(turnosOlavarria).length > 0) {
          cacheTurnosPorMes[claveCache] = {
            fuente: 'Olavarría Noticias',
            direcciones: todasLasFarmacias,
            turnos: turnosOlavarria,
            estimado: false // OK -> Sin alerta
          };
          return cacheTurnosPorMes[claveCache];
        }
      } catch (e) {
        console.warn('Olavarría Noticias no disponible...');
      }

      // Respaldo Final: Patrón de rotación de 9 días (Sólo si fallan las 3 fuentes)
      const turnosEstimados = {};
      for (let dia = 1; dia <= 31; dia++) {
        const fechaEstimada = new Date(fecha.getFullYear(), fecha.getMonth(), dia);
        if (fechaEstimada.getMonth() === fecha.getMonth()) {
          turnosEstimados[dia] = {
            diaSemana: '',
            farmacias: obtenerFarmaciasPorPatron(fechaEstimada)
          };
        }
      }

      cacheTurnosPorMes[claveCache] = {
        fuente: 'Patrón de rotación de 9 días',
        direcciones: todasLasFarmacias,
        turnos: turnosEstimados,
        estimado: true // LAS 3 FUENTES FALLARON -> Muestra la alerta
      };

      return cacheTurnosPorMes[claveCache];
    }

    // -------------------------------------------------------------
    // 5. INTERFAZ DE USUARIO
    // -------------------------------------------------------------
    async function consultarTurnos() {
      const inputFecha = document.getElementById('fechaSelect').value;
      if (!inputFecha) return;

      const [anio, mes, dia] = inputFecha.split('-').map(Number);
      const fechaSeleccionada = new Date(anio, mes - 1, dia);

      document.getElementById('fechaMostrar').innerText = `${dia}/${mes}/${anio}`;
      document.getElementById('listaFarmacias').innerHTML = 'Cargando...';

      try {
        const datosMes = await obtenerDatosDelMes(fechaSeleccionada);
        
        // Controla la visibilidad de la alerta
        const alertaDiv = document.getElementById('alertaEspecial');
        if (datosMes.estimado === true) {
          alertaDiv.style.display = 'block';
        } else {
          alertaDiv.style.display = 'none';
        }

        document.getElementById('fuenteUsada').innerText = `Fuente consultada: ${datosMes.fuente}`;

        const infoDia = datosMes.turnos[dia];
        if (infoDia && infoDia.farmacias && infoDia.farmacias.length > 0) {
          let html = '<div>';
          infoDia.farmacias.forEach(farmacia => {
            const direccion = datosMes.direcciones[farmacia] || 'Dirección no especificada';
            html += `<div class="farmacia-item"><strong>${farmacia}</strong> - ${direccion}</div>`;
          });
          html += '</div>';
          document.getElementById('listaFarmacias').innerHTML = html;
        } else {
          document.getElementById('listaFarmacias').innerHTML = 'No hay datos disponibles para la fecha seleccionada.';
        }

      } catch (error) {
        console.error(error);
        document.getElementById('listaFarmacias').innerHTML = 'Error de conexión al cargar la información.';
      }
    }

    // Cargar la fecha actual al iniciar
    window.onload = function() {
      const hoy = new Date();
      const yyyy = hoy.getFullYear();
      const mm = String(hoy.getMonth() + 1).padStart(2, '0');
      const dd = String(hoy.getDate()).padStart(2, '0');
      document.getElementById('fechaSelect').value = `${yyyy}-${mm}-${dd}`;
      consultarTurnos();
    };
  </script>
</body>
</html>
